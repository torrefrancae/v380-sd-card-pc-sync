name: Windows installer

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  installer:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci
      - run: npm run build

      - name: Stage the app and runtime
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path build/win/dist, build/win/public, build/win/runtime | Out-Null
          Copy-Item dist/server.mjs build/win/dist/
          Copy-Item public/index.html build/win/public/
          Copy-Item installer/launch.vbs build/win/
          Copy-Item LICENSE build/win/
          Invoke-WebRequest "https://nodejs.org/dist/v20.20.2/node-v20.20.2-win-x64.zip" -OutFile node.zip
          Expand-Archive node.zip -DestinationPath node-extract
          Copy-Item node-extract/node-v20.20.2-win-x64/node.exe build/win/runtime/
          Invoke-WebRequest "https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-gpl.zip" -OutFile ffmpeg.zip
          Expand-Archive ffmpeg.zip -DestinationPath ffmpeg-extract
          $ffmpeg = Get-ChildItem -Recurse ffmpeg-extract -Filter ffmpeg.exe | Select-Object -First 1
          Copy-Item $ffmpeg.FullName build/win/runtime/
          $license = Get-ChildItem -Recurse ffmpeg-extract -Filter LICENSE | Select-Object -First 1
          if ($license) { Copy-Item $license.FullName build/win/FFMPEG-LICENSE.txt }

      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Compile the installer
        run: "& '${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe' installer\V380SdSync.iss"

      - uses: actions/upload-artifact@v4
        with:
          name: V380SdSync-Setup
          path: dist/installer/*.exe

      - name: Publish the installer
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/installer/*.exe
          generate_release_notes: true
